    <meta charset="UTF-8" />

  <body>
    <script>
      function Node(data) {
        return {
          data,
          left: null,
          right: null,
        };
      }

      function Tree(array) {
        let root = buildTree(array);

        function includes(value, node = root) {
          if (node === null) {
            return false;
          }

          if (value === node.data) {
            return true;
          }

          if (value < node.data) {
            return includes(value, node.left);
          }

          return includes(value, node.right);
        }

        function insert(value, node = root) {
          if (value === node.data) {
            return;
          }

          if (value < node.data) {
            if (node.left === null) {
              node.left = Node(value);
              return;
            }

            insert(value, node.left);
          }

          if (value > node.data) {
            if (node.right === null) {
              node.right = Node(value);
              return;
            }

            insert(value, node.right);
          }
        }

        function deleteItem(value) {
          root = deleteNode(root, value);
        }

        function deleteItem(value) {
          root = deleteNode(root, value);
        }

        function deleteNode(node, value) {
          if (node === null) {
            return null;
          }

          // SEARCH LEFT
          if (value < node.data) {
            node.left = deleteNode(node.left, value);
            return node;
          }

          // SEARCH RIGHT
          if (value > node.data) {
            node.right = deleteNode(node.right, value);
            return node;
          }

          // NODE FOUND

          // CASE 1: NO CHILDREN
          if (node.left === null && node.right === null) {
            return null;
          }

          // CASE 2: ONE CHILD
          if (node.left === null) {
            return node.right;
          }

          if (node.right === null) {
            return node.left;
          }

          // CASE 3: TWO CHILDREN
          let successor = getMin(node.right);

          node.data = successor.data;

          node.right = deleteNode(node.right, successor.data);

          return node;
        }

        function getMin(node) {
          while (node.left !== null) {
            node = node.left;
          }

          return node;
        }

        function getMin(node) {
          while (node.left !== null) {
            node = node.left;
          }

          return node;
        }

        function levelOrderForEach(callback) {
          if (typeof callback !== "function") {
            throw new Error("Callback is required");
          }

          if (root === null) {
            return;
          }

          const queue = [root];

          while (queue.length > 0) {
            const currentNode = queue.shift();

            callback(currentNode.data);

            if (currentNode.left !== null) {
              queue.push(currentNode.left);
            }

            if (currentNode.right !== null) {
              queue.push(currentNode.right);
            }
          }
        }

        function inOrderForEach(callback, node = root) {
          if (typeof callback !== "function") {
            throw new Error("Callback is required");
          }

          if (node === null) {
            return;
          }

          inOrderForEach(callback, node.left);

          callback(node.data);

          inOrderForEach(callback, node.right);
        }

        function preOrderForEach(callback, node = root) {
          if (typeof callback !== "function") {
            throw new Error("Callback is required");
          }

          if (node === null) {
            return;
          }

          callback(node.data);

          preOrderForEach(callback, node.left);

          preOrderForEach(callback, node.right);
        }

        function postOrderForEach(callback, node = root) {
          if (typeof callback !== "function") {
            throw new Error("Callback is required");
          }

          if (node === null) {
            return;
          }

          postOrderForEach(callback, node.left);

          postOrderForEach(callback, node.right);

          callback(node.data);
        }

        function findNode(value, node = root) {
          if (node === null) {
            return null;
          }

          if (value === node.data) {
            return node;
          }

          if (value < node.data) {
            return findNode(value, node.left);
          }

          return findNode(value, node.right);
        }

        function getHeight(node) {
          if (node === null) {
            return -1;
          }

          const leftHeight = getHeight(node.left);
          const rightHeight = getHeight(node.right);

          return Math.max(leftHeight, rightHeight) + 1;
        }

        function height(value) {
          const targetNode = findNode(value);

          if (targetNode === null) {
            return undefined;
          }

          return getHeight(targetNode);
        }

        function depth(value, node = root, edges = 0) {
            if (node === null){
                return undefined;
            }

            if (value === node.data) {
                return edges;
            }

            if (value < node.data) {
                return depth(value, node.left, edges + 1);
            }

            return depth(value, node.right, edges + 1);
        }

        function isBalanced(node = root){
            if (node === null) {
                return true;
            }

            const leftHeight = getHeight(node.left);
            const rightHeight = getHeight(node.right);

            const heightDifference = Math.abs(leftHeight - rightHeight);

            if (heightDifference > 1) {
                return false;
            }

            return isBalanced(node.left) && isBalanced(node.right);
        }

        function rebalance() {
            const values = [];

            inOrderForEach((value) => {
                values.push(value);
            });

            root = buildTree(values);
        }

        return {
          root,
          includes,
          insert,
          deleteItem,
          levelOrderForEach,
          inOrderForEach,
          preOrderForEach,
          postOrderForEach,
          height,
          depth,
          isBalanced,
          rebalance,
        };
      }

      function buildTree(array) {
        const sortedUniqueArray = [...new Set(array)].sort((a, b) => a - b);

        function buildBalancedTree(start, end) {
          if (start > end) {
            return null;
          }

          const mid = Math.floor((start + end) / 2);

          const root = Node(sortedUniqueArray[mid]);

          root.left = buildBalancedTree(start, mid - 1);

          root.right = buildBalancedTree(mid + 1, end);

          return root;
        }

        return buildBalancedTree(0, sortedUniqueArray.length - 1);
      }

      const prettyPrint = (node, prefix = "", isLeft = true) => {
        if (node === null || node === undefined) {
          return;
        }

        prettyPrint(node.right, `${prefix}${isLeft ? "│   " : "    "}`, false);

        console.log(`${prefix}${isLeft ? "└── " : "┌── "}${node.data}`);

        prettyPrint(node.left, `${prefix}${isLeft ? "    " : "│   "}`, true);
      };

      const tree = Tree([1, 2, 3, 4, 5, 6, 7]);

      console.log(tree.isBalanced());

      tree.insert(8);
      tree.insert(9);
      tree.insert(10);

      console.log(tree.isBalanced());

      tree.rebalance();

      console.log(tree.isBalanced());
      prettyPrint(tree.root);
    </script>
